<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOI4 Mod Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg: #14181a;
    --panel: #1c2225;
    --panel-2: #232b2e;
    --line: #313b3e;
    --text: #dfe6e6;
    --dim: #8a9699;
    --accent: #8fae5d;
    --accent-2: #b4842f;
    --danger: #b6543f;
    --mono: 'Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    line-height:1.45;
  }
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px;}

  /* ---- language picker ---- */
  #langScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
  }
  #langScreen h1{font-size:1.3rem;margin:0 0 8px;text-transform:uppercase;letter-spacing:.5px;}
  #langScreen p{color:var(--dim);max-width:420px;margin:0 0 28px;font-size:.9rem;}
  .lang-choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .lang-btn{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:18px 30px;
    border-radius:6px;
    font-size:1.05rem;
    cursor:pointer;
    min-width:160px;
  }
  .lang-btn:hover{border-color:var(--accent);color:var(--accent);}

  header{
    padding:22px 4px 18px;
    border-bottom:2px solid var(--accent);
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  header h1{
    margin:0 0 6px;
    font-size:1.4rem;
    letter-spacing:.5px;
    text-transform:uppercase;
  }
  header p{margin:0;color:var(--dim);font-size:.92rem;}
  #switchLangBtn{
    flex-shrink:0;
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    padding:6px 10px;
    border-radius:4px;
    font-size:.78rem;
    cursor:pointer;
    white-space:nowrap;
  }
  #switchLangBtn:hover{border-color:var(--accent);color:var(--accent);}
  .section{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:16px;
    overflow:hidden;
  }
  .section > .head{
    padding:12px 16px;
    background:var(--panel-2);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    gap:10px;
    cursor:pointer;
    user-select:none;
  }
  .section > .head .num{
    color:var(--accent);
    font-family:var(--mono);
    font-weight:700;
  }
  .section > .head h2{margin:0;font-size:1.02rem;}
  .section > .head .hint{margin-left:auto;color:var(--dim);font-size:.8rem;}
  .section > .body{padding:16px;}
  .section.collapsed > .body{display:none;}
  label{display:block;font-size:.85rem;color:var(--dim);margin-bottom:4px;}
  input[type=text], input[type=number]{
    width:100%;
    background:#111516;
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:4px;
    font-size:.92rem;
  }
  input[type=text]:focus, input[type=number]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  @media (max-width:560px){ .row{grid-template-columns:1fr;} }
  .sizes-row{grid-template-columns:repeat(3,1fr) !important;}
  @media (max-width:560px){ .sizes-row{grid-template-columns:1fr !important;} }
  .field{margin-bottom:10px;}
  .ideology-card{
    border:1px solid var(--line);
    border-radius:5px;
    padding:12px;
    margin-bottom:12px;
    background:#181e20;
  }
  .ideology-card h3{
    margin:0 0 10px;
    font-size:.88rem;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--accent-2);
  }
  .lang-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:560px){ .lang-pair{grid-template-columns:1fr;} }
  .lang-pair .lbl{font-size:.72rem;color:var(--dim);margin-bottom:3px;}
  .tagbox input{text-transform:uppercase;font-family:var(--mono);letter-spacing:2px;font-size:1.1rem;max-width:140px;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:4px;
    padding:9px 16px;
    font-size:.88rem;
    font-weight:600;
  }
  .btn-primary{background:var(--accent);color:#14181a;}
  .btn-primary:hover{background:#a0c26e;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .puppet-block{border:1px dashed var(--line);padding:12px;border-radius:5px;margin-bottom:12px;position:relative;}
  .puppet-block .rm{position:absolute;top:8px;right:8px;}
  .note{
    font-size:.82rem;
    color:var(--dim);
    background:#191f21;
    border-left:3px solid var(--accent-2);
    padding:9px 12px;
    border-radius:0 4px 4px 0;
    margin:10px 0;
  }
  .flagzone{
    border:2px dashed var(--line);
    border-radius:6px;
    padding:22px;
    text-align:center;
    color:var(--dim);
    cursor:pointer;
    transition:.15s;
  }
  .flagzone.drag{border-color:var(--accent);color:var(--text);}
  .flagzone input{display:none;}
  .sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
  @media (max-width:560px){ .sizes{grid-template-columns:1fr;} }
  .size-card{background:#181e20;border:1px solid var(--line);border-radius:5px;padding:10px;text-align:center;}
  .size-card .prev{
    width:100%;height:70px;
    display:flex;align-items:center;justify-content:center;
    background:repeating-conic-gradient(#20272a 0% 25%, #191f21 0% 50%) 0 0/16px 16px;
    border-radius:4px;margin-bottom:8px;overflow:hidden;
  }
  .size-card .prev canvas{max-width:100%;max-height:100%;image-rendering:pixelated;}
  .size-card .dims{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:6px;}
  .size-card .dims input{width:56px;text-align:center;padding:5px;}
  footer.actions{
    position:sticky;bottom:0;
    background:linear-gradient(to top, var(--bg) 70%, transparent);
    padding:18px 0 6px;
    display:flex;gap:10px;align-items:center;
    flex-wrap:wrap;
  }
  #status{font-size:.85rem;color:var(--dim);}
  #status.err{color:var(--danger);}
  #status.ok{color:var(--accent);}
  .example{font-size:.72rem;color:#5f6d70;margin-top:2px;}
</style>
</head>
<body>

<div id="langScreen">
  <h1 id="pickTitle">Выберите язык интерфейса / Choose interface language</h1>
  <p id="pickSub">Выбранный язык — это и язык интерфейса, и язык локализации, которую сгенерирует мод.</p>
  <div class="lang-choices">
    <button class="lang-btn" onclick="setLang('ru')">Русский</button>
    <button class="lang-btn" onclick="setLang('en')">English</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">

  <header>
    <div>
      <h1 id="headerTitle">HOI4 Mod Generator</h1>
      <p id="headerSub"></p>
    </div>
    <button id="switchLangBtn" onclick="backToPicker()"></button>
  </header>

  <div class="note" id="limitNote"></div>

  <!-- SECTION 1: BASE -->
  <div class="section" data-section>
    <div class="head" onclick="toggleSection(this)">
      <span class="num">01</span><h2 id="sec1Title"></h2>
      <span class="hint">▾</span>
    </div>
    <div class="body">
      <div class="row">
        <div class="field tagbox">
          <label id="tagLabel" for="tag"></label>
          <input type="text" id="tag" maxlength="3" placeholder="SOV">
          <div class="example" id="tagExample"></div>
        </div>
        <div class="field">
          <label id="modNameLabel" for="modName"></label>
          <input type="text" id="modName">
        </div>
      </div>
    </div>
  </div>

  <!-- SECTION 2: NAMES -->
  <div class="section" data-section>
    <div class="head" onclick="toggleSection(this)">
      <span class="num">02</span><h2 id="sec2Title"></h2>
      <span class="hint">▾</span>
    </div>
    <div class="body">
      <div class="note" id="sec2Note"></div>
      <div id="ideologyList"></div>
    </div>
  </div>

  <!-- SECTION 3: PUPPETS -->
  <div class="section collapsed" data-section>
    <div class="head" onclick="toggleSection(this)">
      <span class="num">03</span><h2 id="sec3Title"></h2>
      <span class="hint">▾</span>
    </div>
    <div class="body">
      <div class="note" id="sec3Note"></div>
      <div id="puppetList"></div>
      <button class="btn-ghost" id="addPuppetBtn" onclick="addPuppet()"></button>
    </div>
  </div>

  <!-- SECTION 4: FLAG -->
  <div class="section collapsed" data-section>
    <div class="head" onclick="toggleSection(this)">
      <span class="num">04</span><h2 id="sec4Title"></h2>
      <span class="hint">▾</span>
    </div>
    <div class="body">
      <div class="note" id="sec4Note"></div>
      <div class="row sizes-row" style="margin-bottom:6px;">
        <div class="field">
          <label>large</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="number" id="wLarge" value="82"> × <input type="number" id="hLarge" value="52">
          </div>
        </div>
        <div class="field">
          <label>medium</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="number" id="wMedium" value="41"> × <input type="number" id="hMedium" value="26">
          </div>
        </div>
        <div class="field">
          <label>small</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="number" id="wSmall" value="10"> × <input type="number" id="hSmall" value="6">
          </div>
        </div>
      </div>
      <div class="note" id="sizesNote"></div>
      <div id="flagList"></div>
    </div>
  </div>

  <!-- SECTION 5: COLOR -->
  <div class="section collapsed" data-section>
    <div class="head" onclick="toggleSection(this)">
      <span class="num">05</span><h2 id="sec5Title"></h2>
      <span class="hint">▾</span>
    </div>
    <div class="body">
      <div class="note" id="sec5Note"></div>
      <div class="ideology-card">
        <label style="display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--text);margin-bottom:10px;">
          <input type="checkbox" id="colorEnable" style="width:auto;" onchange="document.getElementById('mainColor').disabled=!this.checked;">
          <span id="colorEnableLabel"></span>
        </label>
        <div style="display:flex;align-items:center;gap:12px;">
          <input type="color" id="mainColor" value="#8b2f2f" disabled style="width:60px;height:40px;padding:2px;background:#111516;border:1px solid var(--line);border-radius:4px;">
        </div>
      </div>
    </div>
  </div>

  <footer class="actions">
    <button class="btn-primary" id="downloadBtn" onclick="generateMod()"></button>
    <span id="status"></span>
  </footer>

</div>

<script>
// ======================= TRANSLATIONS =======================
const TRANSLATIONS = {
  ru: {
    headerTitle: "HOI4 Mod Generator",
    headerSub: "Собирает шаблонный мод для Hearts of Iron IV: смена названия страны (по идеологиям и для марионеток) и флага. Без вкусовщины в дизайне — только форма и кнопка «Скачать».",
    switchLangBtn: "Сменить язык",
    limitNote: "Мод меняет только вашу исходную страну (тег, который вы укажете ниже). Игра подгружает локализацию и флаги при старте, поэтому если вы включите мод уже после того, как сформировали новую страну прямо в текущей партии (например, «Северный совет»), название и флаг не обновятся — это ограничение движка, не баг генератора. Начинайте партию заново или включайте мод до формирования.",
    sec1Title: "Тег и название мода",
    tagLabel: "Тег страны (3 символа, как в игре)",
    tagExample: "Пример: SOV, GER, ENG, D06...",
    modNameLabel: "Название мода",
    modNamePh: "Новое имя SOV",
    sec2Title: "Локализация названия",
    sec2Note: "4 блока — по одному на каждую идеологию (Демократия / Фашизм / Коммунизм / Нейтралитет), заполняются только если нужны. «Нейтралитет» обязателен: почти все страны стартуют в игре именно с этой идеологией, и её значения автоматически используются как запасное название, если для правящей идеологии страны нет отдельного варианта.",
    ideoDemocratic: "Демократия",
    ideoFascism: "Фашизм",
    ideoCommunism: "Коммунизм",
    ideoNeutrality: "Нейтралитет",
    fieldName: "Название",
    fieldDef: "Полное название с артиклем",
    fieldAdj: "Прилагательное",
    adjHintLabel: "исп. в капитуляции:",
    sec3Title: "Марионетки / уникальные теги (опционально)",
    sec3Note: "Работает только для марионеток с фиксированным тегом (например, историческая Reichskommissariat Ostland = OST). Для марионеток, которым игра присваивает тег динамически при освобождении/аннексии, локализации недостаточно — нужно ещё редактировать историю страны/теги, это генератор не делает.",
    puppetTagLabel: "Тег марионетки",
    addPuppetBtn: "+ Добавить марионетку",
    sec4Title: "Флаг",
    sec4Note: "4 блока под идеологии, как и с названиями. «Нейтралитет» желательно заполнить — его флаг автоматически используется как запасной для правящих идеологий без отдельного флага. Правее видно, как флаг будет выглядеть в игре при выбранных размерах.",
    sec5Title: "Цвет страны",
    sec5Note: "Важно: в HOI4 цвет страны на карте — это одно фиксированное значение, движок НЕ умеет менять его автоматически по идеологии (в отличие от названий и флагов). Ниже можно задать один цвет, который будет применяться всегда, вне зависимости от идеологии. Настоящая смена цвета при смене идеологии потребовала бы отдельного скриптового мода с эффектами и GUI — это выходит за рамки этого генератора.",
    colorEnableLabel: "Задать свой цвет (иначе останется как в оригинальной игре)",
    flagzoneText: "Нажмите или перетащите PNG / JPG сюда",
    flagLoaded: name => name + " — загружен",
    sizesNote: "Размеры по умолчанию — стандартные для HOI4, их можно изменить. Файлы сохраняются как .tga (32-бит, без сжатия) в gfx/flags/.",
    downloadBtn: "Скачать мод (.zip)",
    errTag: "Укажите корректный тег страны — ровно 3 символа (A-Z, 0-9).",
    errNames: "Заполните хотя бы «Название» и «Прилагательное» в блоке «Нейтралитет».",
    building: "Собираю мод...",
    done: fname => "Готово — мод скачан (" + fname + ")",
    errZip: msg => "Ошибка при сборке архива: " + msg,
    errFlagType: "Флаг должен быть PNG или JPG",
    readme: folder => `Мод сгенерирован HOI4 Mod Generator.

Установка:
1. Распакуйте архив.
2. Положите файл "${folder}.mod" и папку "${folder}" в:
   Documents/Paradox Interactive/Hearts of Iron IV/mod/
3. Включите мод в лаунчере Paradox.

Важно: если вы формируете новую страну (например, через фокус или decision) уже во время партии, мод не переименует её и не заменит флаг "на лету" — игра читает локализацию и флаги при запуске. Начните партию заново после включения мода, если хотите увидеть изменения сразу для сформированной страны.
`
  },
  en: {
    headerTitle: "HOI4 Mod Generator",
    headerSub: "Builds a template mod for Hearts of Iron IV: renaming a country (per ideology and for puppets) and swapping its flag. No design frills — just a form and a Download button.",
    switchLangBtn: "Change language",
    limitNote: "The mod only affects the original tag you enter below. The game loads localisation and flags at startup, so if you enable the mod after already forming a new country in your current game (e.g. the Nordic Council), the name and flag won't update — that's an engine limitation, not a generator bug. Start a new game, or enable the mod before forming the new country.",

    ideoFascism: "Fascist",
    ideoCommunism: "Communist",
    ideoNeutrality: "Neutral",
    fieldName: "Name",
    fieldDef: "Full/definite name",
    fieldAdj: "Adjective",
    adjHintLabel: "used in capitulation:",
    sec3Title: "Puppets / unique tags (optional)",
    sec3Note: "Only works for puppets with a fixed tag (e.g. the historical Reichskommissariat Ostland = OST). For puppets the game assigns a tag to dynamically on release/annexation, localisation alone isn't enough — you'd also need to edit country history/tags, which this generator doesn't do.",

    addPuppetBtn: "+ Add puppet",
    sec4Title: "Flag",
    sec4Note: "Same 4 ideology blocks as the names. It's worth filling in \"Neutral\" — its flag is automatically used as the fallback for ruling ideologies with no dedicated flag. The preview shows how the flag will look in-game at the chosen sizes.",
    sec5Title: "Country color",
    sec5Note: "Important: in HOI4 a country's map color is a single fixed value — the engine can't switch it automatically by ideology the way it does for names and flags. Below you can set one color that always applies, regardless of ideology. Actually changing color per ideology would need a separate scripted mod with effects and a GUI — that's beyond what this generator does.",
    colorEnableLabel: "Set a custom color (otherwise keeps the vanilla one)",
    flagzoneText: "Click or drag a PNG / JPG here",
    flagLoaded: name => name + " — loaded",
    sizesNote: "Default sizes are the standard HOI4 ones — feel free to change them. Files are saved as .tga (32-bit, uncompressed) in gfx/flags/.",
    downloadBtn: "Download mod (.zip)",
    errTag: "Enter a valid country tag — exactly 3 characters (A-Z, 0-9).",
    errNames: "Fill in at least \"Name\" and \"Adjective\" in the \"Neutral\" block.",
    building: "Building mod...",
    done: fname => "Done — mod downloaded (" + fname + ")",
    errZip: msg => "Error building archive: " + msg,
    errFlagType: "Flag must be PNG or JPG",
    readme: folder => `Mod generated by HOI4 Mod Generator.

Install:
1. Unzip the archive.
2. Put the file "${folder}.mod" and the folder "${folder}" into:
   Documents/Paradox Interactive/Hearts of Iron IV/mod/
3. Enable the mod in the Paradox launcher.

Note: if you form a new country in-game (e.g. via a focus or decision) after already starting the campaign, the mod will not rename it or swap its flag "on the fly" — the game reads localisation and flags at startup. Start a new game after enabling the mod if you want to see the changes take effect for a country formed mid-campaign.
`
  }
};

let LANG = 'ru';
let T = TRANSLATIONS.ru;

function setLang(lang){
  LANG = lang;
  T = TRANSLATIONS[lang];
  document.getElementById('htmlRoot').lang = lang;
  document.getElementById('langScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderStaticText();
  initIdeologies();
  flagData = {};
  initFlags();
  document.getElementById('puppetList').innerHTML = '';
  puppetCount = 0;
  setStatus('');
}

function backToPicker(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('langScreen').style.display = 'flex';
}

function renderStaticText(){
  document.getElementById('headerTitle').textContent = T.headerTitle;
  document.getElementById('headerSub').textContent = T.headerSub;
  document.getElementById('switchLangBtn').textContent = T.switchLangBtn;
  document.getElementById('limitNote').textContent = T.limitNote;
  document.getElementById('sec1Title').textContent = T.sec1Title;
  document.getElementById('tagLabel').textContent = T.tagLabel;
  document.getElementById('tagExample').textContent = T.tagExample;
  document.getElementById('modNameLabel').textContent = T.modNameLabel;
  document.getElementById('modName').placeholder = T.modNamePh;
  document.getElementById('sec2Title').textContent = T.sec2Title;
  document.getElementById('sec2Note').textContent = T.sec2Note;
  document.getElementById('sec3Title').textContent = T.sec3Title;
  document.getElementById('sec3Note').textContent = T.sec3Note;
  document.getElementById('addPuppetBtn').textContent = T.addPuppetBtn;
  document.getElementById('sec4Title').textContent = T.sec4Title;
  document.getElementById('sec4Note').textContent = T.sec4Note;
  document.getElementById('sec5Title').textContent = T.sec5Title;
  document.getElementById('sec5Note').textContent = T.sec5Note;
  document.getElementById('colorEnableLabel').textContent = T.colorEnableLabel;
  document.getElementById('sizesNote').textContent = T.sizesNote;
  document.getElementById('downloadBtn').textContent = T.downloadBtn;
}

// ======================= IDEOLOGY DATA =======================
const IDEOLOGIES = [
  {key:'democratic', labelKey:'ideoDemocratic', ph:{
    name_ru:'Российская Республика', name_en:'Russian Republic',
    def_ru:'Российская Демократическая Республика', def_en:'Russian Democratic Republic',
    adj_ru:'Российский', adj_en:'Russian'
  }},
  {key:'fascism', labelKey:'ideoFascism', ph:{
    name_ru:'Русское Государство', name_en:'Russian State',
    def_ru:'Русское Национальное Государство', def_en:'Russian National State',
    adj_ru:'Русский', adj_en:'Russian'
  }},
  {key:'communism', labelKey:'ideoCommunism', ph:{
    name_ru:'Советский Союз', name_en:'Soviet Union',
    def_ru:'Союз Советских Социалистических Республик', def_en:'Union of Soviet Socialist Republics',
    adj_ru:'Советский', adj_en:'Soviet'
  }},
  {key:'neutrality', labelKey:'ideoNeutrality', ph:{
    name_ru:'Российская Держава', name_en:'Russian Dominion',
    def_ru:'Российская Держава', def_en:'Russian Dominion',
    adj_ru:'Российский', adj_en:'Russian'
  }},
];

function fieldsHtml(prefix, ph){
  const nameKey = 'name_' + LANG, defKey = 'def_' + LANG, adjKey = 'adj_' + LANG;
  const adjQuote = LANG === 'ru'
    ? `«${ph.adj_ru.toUpperCase()} СОЮЗ капитулировал»`
    : `"${ph.adj_en.toUpperCase()} UNION has capitulated"`;
  return `
    <div class="field" style="margin-bottom:8px;">
      <div class="lbl">${T.fieldName}</div><input type="text" id="${prefix}_${nameKey}" placeholder="${ph[nameKey]}">
    </div>
    <div class="field" style="margin-bottom:8px;">
      <div class="lbl">${T.fieldDef}</div><input type="text" id="${prefix}_${defKey}" placeholder="${ph[defKey]}">
    </div>
    <div class="field">
      <div class="lbl">${T.fieldAdj} — ${T.adjHintLabel} ${adjQuote}</div><input type="text" id="${prefix}_${adjKey}" placeholder="${ph[adjKey]}">
    </div>
  `;
}

function initIdeologies(){
  const c = document.getElementById('ideologyList');
  c.innerHTML = IDEOLOGIES.map(ideo=>{
    const prefix = 'ideo_' + ideo.key;
    return `<div class="ideology-card"><h3>${T[ideo.labelKey]}</h3>${fieldsHtml(prefix, ideo.ph)}</div>`;
  }).join('');
}

function toggleSection(headEl){
  headEl.parentElement.classList.toggle('collapsed');
}

// ---------- FLAG HANDLING (per ideology) ----------
let flagData = {}; // key ('democratic'|'fascism'|'communism'|'neutrality') -> {img, name}; 'neutrality' also becomes the base TAG.tga fallback

function initFlags(){
  const list = document.getElementById('flagList');
  list.innerHTML = IDEOLOGIES.map(ideo=>{
    const key = ideo.key;
    return `
      <div class="ideology-card">
        <h3>${T[ideo.labelKey]}</h3>
        <div class="flagzone" id="flagzone_${key}" style="padding:14px;">
          <input type="file" id="flagInput_${key}" accept=".png,.jpg,.jpeg" style="display:none">
          <div id="flagzoneText_${key}">${T.flagzoneText}</div>
        </div>
        <div class="sizes" id="sizesPrev_${key}" style="display:none;margin-top:10px;">
          <div class="size-card"><div class="prev"><canvas id="prevLarge_${key}"></canvas></div><div>large</div></div>
          <div class="size-card"><div class="prev"><canvas id="prevMedium_${key}"></canvas></div><div>medium</div></div>
          <div class="size-card"><div class="prev"><canvas id="prevSmall_${key}"></canvas></div><div>small</div></div>
        </div>
      </div>`;
  }).join('');

  IDEOLOGIES.forEach(ideo=>{
    const key = ideo.key;
    const input = document.getElementById('flagInput_' + key);
    const zone = document.getElementById('flagzone_' + key);
    zone.addEventListener('click', () => input.click());
    input.addEventListener('change', e => handleFlagFile(key, e.target.files[0]));
    ['dragover','dragenter'].forEach(evt => zone.addEventListener(evt, e=>{e.preventDefault(); zone.classList.add('drag');}));
    ['dragleave','drop'].forEach(evt => zone.addEventListener(evt, e=>{e.preventDefault(); zone.classList.remove('drag');}));
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('drag');
      const f = e.dataTransfer.files[0];
      if (f) handleFlagFile(key, f);
    });
  });
}

function handleFlagFile(key, file){
  if (!file) return;
  if (!/image\/(png|jpe?g)/.test(file.type)){
    setStatus(T.errFlagType, true);
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      flagData[key] = {img, name: file.name};
      document.getElementById('flagzoneText_' + key).textContent = T.flagLoaded(file.name);
      document.getElementById('sizesPrev_' + key).style.display = 'grid';
      document.querySelectorAll('[data-section]')[3].classList.remove('collapsed');
      updateFlagPreview(key);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

['wLarge','hLarge','wMedium','hMedium','wSmall','hSmall'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updateAllFlagPreviews);
});

function updateAllFlagPreviews(){
  Object.keys(flagData).forEach(updateFlagPreview);
}

function updateFlagPreview(key){
  const d = flagData[key];
  if (!d) return;
  drawInto('prevLarge_' + key, +val('wLarge'), +val('hLarge'), d.img);
  drawInto('prevMedium_' + key, +val('wMedium'), +val('hMedium'), d.img);
  drawInto('prevSmall_' + key, +val('wSmall'), +val('hSmall'), d.img);
}

function drawInto(canvasId, w, h, img){
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(img, 0, 0, w, h);
}

function canvasToTGABytes(canvas){

  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');
  const src = ctx.getImageData(0,0,w,h).data;
  const header = new Uint8Array(18);
  header[2] = 2;
  header[12] = w & 0xFF; header[13] = (w >> 8) & 0xFF;
  header[14] = h & 0xFF; header[15] = (h >> 8) & 0xFF;
  header[16] = 32;
  header[17] = 0x28; // top-left origin, 8 alpha bits
  const pixels = new Uint8Array(w * h * 4);
  for (let i = 0; i < w*h; i++){
    const r = src[i*4], g = src[i*4+1], b = src[i*4+2], a = src[i*4+3];
    pixels[i*4]   = b;
    pixels[i*4+1] = g;
    pixels[i*4+2] = r;
    pixels[i*4+3] = a;
  }
  const out = new Uint8Array(header.length + pixels.length);
  out.set(header, 0);
  out.set(pixels, header.length);
  return out;
}

// ---------- BUILD ----------
function setStatus(msg, isErr, isOk){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isErr ? 'err' : (isOk ? 'ok' : '');
}

function val(id){ return document.getElementById(id).value.trim(); }

function sanitizeFolderName(s){
  return s.replace(/[^a-zA-Z0-9_\- ]/g,'').trim().replace(/\s+/g,'_') || 'HOI4_Mod';
}

async function generateMod(){
  setStatus(T.building);
  const tag = val('tag').toUpperCase();
  if (!/^[A-Z0-9]{3}$/.test(tag)){
    setStatus(T.errTag, true);
    return;
  }
  const neutName = val('ideo_neutrality_name_' + LANG);
  const neutAdj = val('ideo_neutrality_adj_' + LANG);
  if (!neutName || !neutAdj){
    setStatus(T.errNames, true);
    return;
  }

  const modNameRaw = val('modName') || ('Rename_' + tag);
  const folder = sanitizeFolderName(modNameRaw);

  const zip = new JSZip();
  const root = zip.folder(folder);

  const blocks = [];
  IDEOLOGIES.forEach(ideo=>{
    const prefix = 'ideo_' + ideo.key;
    const n = val(prefix+'_name_'+LANG), d = val(prefix+'_def_'+LANG), a = val(prefix+'_adj_'+LANG);
    if (n || d || a) blocks.push({suffix: ideo.key, name:n, def:d, adj:a});
  });
  // "Нейтралитет" also becomes the base fallback name (TAG with no suffix),
  // since that's the ideology almost every country starts the game with.
  const neutralBlock = blocks.find(b => b.suffix === 'neutrality');
  if (neutralBlock) blocks.unshift({suffix:'', name:neutralBlock.name, def:neutralBlock.def, adj:neutralBlock.adj});

  document.querySelectorAll('.puppet-block').forEach(block=>{
    const id = block.id.split('_')[1];
    const ptag = val('p'+id+'_tag').toUpperCase();
    if (!/^[A-Z0-9]{3}$/.test(ptag)) return;
    const n = val('p'+id+'_name_'+LANG), d = val('p'+id+'_def_'+LANG), a = val('p'+id+'_adj_'+LANG);
    if (n || d || a) blocks.push({suffix:'', tagOverride:ptag, name:n, def:d, adj:a});
  });

  function buildYml(langKey, blocks){
    let out = 'l_' + langKey + ':\n';
    blocks.forEach(b=>{
      const useTag = b.tagOverride || tag;
      const base = useTag + (b.suffix ? '_' + b.suffix : '');
      if (b.name) out += ` ${base}:0 "${b.name}"\n`;
      if (b.def)  out += ` ${base}_DEF:0 "${b.def}"\n`;
      if (b.adj)  out += ` ${base}_ADJ:0 "${b.adj}"\n`;
    });
    return out;
  }

  const BOM = '\uFEFF';
  const langKey = LANG === 'ru' ? 'russian' : 'english';
  root.folder('localisation').folder(langKey).file(
    folder + '_names_l_' + langKey + '.yml',
    BOM + buildYml(langKey, blocks)
  );

  const flagEntries = Object.keys(flagData).map(key => ({key, img: flagData[key].img}));
  if (flagData['neutrality']) flagEntries.unshift({key:'', img: flagData['neutrality'].img});
  if (flagEntries.length){
    const sizeDefs = [
      {folder:null, w:+val('wLarge'), h:+val('hLarge')},
      {folder:'medium', w:+val('wMedium'), h:+val('hMedium')},
      {folder:'small', w:+val('wSmall'), h:+val('hSmall')},
    ];
    const gfx = root.folder('gfx').folder('flags');
    flagEntries.forEach(entry=>{
      const suffix = entry.key ? ('_' + entry.key) : '';
      sizeDefs.forEach(sd=>{
        const c = document.createElement('canvas');
        c.width = sd.w; c.height = sd.h;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(entry.img, 0, 0, sd.w, sd.h);
        const bytes = canvasToTGABytes(c);
        const target = sd.folder ? gfx.folder(sd.folder) : gfx;
        target.file(tag + suffix + '.tga', bytes);
      });
    });
  }

  function hexToRgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
  }

  const colorEntries = [];
  if (document.getElementById('colorEnable').checked){
    colorEntries.push({tag, rgb: hexToRgb(val('mainColor'))});
  }
  document.querySelectorAll('.puppet-block').forEach(block=>{
    const id = block.id.split('_')[1];
    const ptag = val('p'+id+'_tag').toUpperCase();
    if (!/^[A-Z0-9]{3}$/.test(ptag)) return;
    const cb = document.getElementById('p'+id+'_colorEnable');
    if (cb && cb.checked){
      colorEntries.push({tag: ptag, rgb: hexToRgb(val('p'+id+'_color'))});
    }
  });
  if (colorEntries.length){
    let colorsTxt = 'colors = {\n';
    colorEntries.forEach(ce=>{
      colorsTxt += `\t${ce.tag} = {\n\t\tcolor = rgb { ${ce.rgb[0]} ${ce.rgb[1]} ${ce.rgb[2]} }\n\t\tcolor_ui = rgb { ${ce.rgb[0]} ${ce.rgb[1]} ${ce.rgb[2]} }\n\t}\n`;
    });
    colorsTxt += '}\n';
    root.folder('common').folder('countries').file(folder + '_colors.txt', colorsTxt);
  }

  const descriptorContent =
`version="1.0"
tags={
	"Graphics"
}
name="${modNameRaw}"
supported_version="1.18.*"
`;
  root.file('descriptor.mod', descriptorContent);
  zip.file(folder + '.mod', descriptorContent + `path="mod/${folder}"\n`);
  root.file('readme.txt', T.readme(folder));

  try{
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = folder + '.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setStatus(T.done(folder + '.zip'), false, true);
  }catch(err){
    console.error(err);
    setStatus(T.errZip(err.message), true);
  }
}
</script>
