<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoI4 Mod Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <!-- Модальное окно выбора языка -->
    <div id="lang-modal" class="modal">
        <div class="modal-content">
            <h2>Select Language / Выберите язык</h2>
            <button onclick="setLanguage('en')">English</button>
            <button onclick="setLanguage('ru')">Русский</button>
        </div>
    </div>

    <div class="container" id="main-content" style="display: none;">
        <h1 id="title-text">HoI4 Country Mod Builder</h1>
        
        <div class="section">
            <label id="mod-name-label">Название мода / Mod Name:</label>
            <input type="text" id="modName" placeholder="Например: Greater Russia Mod" oninput="saveData()">
            
            <label id="tag-label">Тег страны (TAG) / Country Tag:</label>
            <input type="text" id="countryTag" placeholder="Например: RUS" maxlength="3" oninput="saveData()">
        </div>

        <div id="ideologies-container">
            <!-- Сюда динамически загружаются формы для идеологий -->
        </div>

        <button id="generate-btn" onclick="generateMod()">Generate Mod / Создать мод</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
